name: Analysis

# Full re-parse of the letters already in the repo, without pulling the dashboards:
# requested letters, findings and submittal dates (letters_analysis.csv), milestones (timelines),
# statute citations, keywords, standard language, requirements and the Markdown indexes.
# Run it by hand (Actions tab -> Analysis -> Run workflow) after changing a parsing script.
# The weekly jobs run the same steps on new letters. The Website workflow rebuilds after it.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04   # pinned; ubuntu-latest is moving to Ubuntu 26
    env:
      PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}   # optional secret: personal terms that must never be published
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install pdftotext, OCR and numpy
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-numpy

      - name: Re-parse everything
        run: bash scripts/reparse_all.sh

      - name: Summary
        run: |
          { echo "### Milestones"; wc -l < he_letters/milestones.csv 2>/dev/null | sed 's/^/rows: /' || true
            echo; head -40 he_letters/REQUIREMENTS.md 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          bash scripts/commit_and_push.sh \
            "Full re-parse of letters in the repo ($(date -u +%F))" \
            "bash scripts/reparse_all.sh" \
            hau he_letters requested
